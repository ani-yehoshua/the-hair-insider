<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Welcome to The Hair Insider</title>
</head>

<body
  style="margin:0;padding:0;background-color:#7C7E73;font-family:ui-serif,Baskerville,Georgia,'Times New Roman',Times,serif;color:#343430;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="padding:32px 16px">
    <tr>
      <td align="center">
        <table role="presentation" width="100%" cellpadding="0" cellspacing="0"
          style="max-width:520px;background-color:#ddd9d5;border-radius:16px;padding:32px;">
          <tr>
            <td style="padding-bottom:16px">
              <p style="margin:0;font-size:14px;letter-spacing:0.04em;text-transform:uppercase;">The Hair Insider</p>
            </td>
          </tr>
          <tr>
            <td style="padding-bottom:16px">
              <h1 style="margin:0;font-size:24px;font-weight:600;line-height:1.3;">You're almost in...</h1>
            </td>
          </tr>
          <tr>
            <td style="padding-bottom:24px">
              <p style="margin:0;font-size:16px;line-height:1.6;">Enter this code to confirm your email and finish
                creating your account.</p>
            </td>
          </tr>
          <tr>
            <td align="center" style="padding-bottom:24px">
              <p
                style="margin:0;display:inline-block;padding:14px 24px;background-color:#343430;color:#ffffff;font-size:28px;font-weight:600;letter-spacing:0.3em;border-radius:16px;">
                {{ .Token }}
              </p>
            </td>
          </tr>
          <tr>
            <td style="border-top:1px solid #c8c4be;padding-top:16px">
              <p style="margin:0;font-size:12px;line-height:1.5;">This code expires shortly and can only be used
                once. If you didn't sign up for The Hair Insider, you can safely ignore this.</p>
            </td>
          </tr>
        </table>
        <p style="margin:16px 0 0;font-size:12px;color:#ddd9d5;">© 2026 The Hair Insider</p>
      </td>
    </tr>
  </table>
</body>

</html>
